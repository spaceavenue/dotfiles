# Helix Editor Configuration

theme = "catppuccin_mocha_custom"

[editor]
cursorline = true
bufferline = "always"
color-modes = true
true-color = true
clipboard-provider = "wayland"

[editor.breadcrumb]
enable = true

[editor.smart-tab]
enable = false

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
git-ignore = false

[editor.statusline]
left = ["mode", "spacer", "version-control", "file-name", "read-only-indicator", "file-modification-indicator"]
right = ["diagnostics", "selections", "position", "total-line-numbers", "file-encoding", "file-type"]

[editor.lsp]
display-inlay-hints = true

[editor.gutters]
layout = ["diagnostics", "line-numbers", "diff", "spacer"]

[editor.gutters.line-numbers]
min-width = 2

[editor.indent-guides]
render = true

[editor.soft-wrap]
enable = true

[keys.normal]
space.i = ":toggle lsp.display-inlay-hints"
"g"."R" = "goto_reference"

[keys.insert]
C-right = "move_next_long_word_start"
C-left = "move_prev_long_word_start"
C-backspace = "delete_word_backward"
C-del = "delete_word_forward"
